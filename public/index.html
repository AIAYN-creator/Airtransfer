<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airtransfer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Airtransfer</h1>
    <p class="subtitle">Envía un archivo cifrado entre tus dispositivos</p>

    <label for="file-input" class="dropzone">
      <span id="file-label">Elige un archivo</span>
      <input type="file" id="file-input" hidden />
    </label>

    <button id="upload-btn" disabled>Subir archivo</button>

    <p id="status"></p>

    <div class="stats">
      <p class="stats-label">Transferencias</p>
      <div class="stats-bar"><div class="stats-fill" id="uploads-fill"></div></div>
      <p id="uploads-text" class="stats-text"></p>

      <p class="stats-label">Almacenamiento</p>
      <div class="stats-bar"><div class="stats-fill" id="storage-fill"></div></div>
      <p id="storage-text" class="stats-text"></p>
    </div>
  </main>

  <script src="crypto-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
